<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四球数据馆 · 篮球/足球/乒乓球/羽毛球运动员数据库</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="textured-bg">

<header id="hero" class="fade-in stagger-1">
  <div class="hero-left">
    <div class="hero-kicker">🏆 FOUR SPORTS · ONE ALMANAC</div>
    <h1>四球数据馆</h1>
    <p class="hero-sub">篮球 · 足球 · 乒乓球 · 羽毛球 —— 运动员数据一站式查询</p>
    <nav id="sport-tabs">
      <button class="sport-tab active" data-sport="basketball">🏀 篮球</button>
      <button class="sport-tab" data-sport="football">⚽ 足球</button>
      <button class="sport-tab" data-sport="tt">🏓 乒乓球</button>
      <button class="sport-tab" data-sport="bd">🏸 羽毛球</button>
    </nav>
  </div>
  <div class="hero-right">
    <div id="search-wrap">
      <input id="search-input" type="text" placeholder="搜索球员(支持中英文,如:詹姆斯 / LeBron / 姚明)" autocomplete="off">
      <div id="search-suggest"></div>
    </div>
  </div>
</header>

<nav id="crumb" class="fade-in stagger-2">
  <a href="#/" id="crumb-home">🏠 全部球队</a>
  <span id="crumb-sep" hidden> / </span><span id="crumb-now"></span>
</nav>

<main id="view"></main>

<footer id="foot">
  <span>篮球/足球数据实时来自 ESPN Stats API</span>
  <span>· 乒乓球/羽毛球荣誉库人工整理 · 常规赛开赛后当赛季数据自动更新</span>
</footer>

<script src="data/teams.js"></script>
<script src="data/live_index.js"></script>
<script src="data/honors.js"></script>
<script src="data/soccer_teams_zh.js"></script>
<script src="data/soccer_index.js"></script>
<script src="data/soccer_honors.js"></script>
<script src="data/soccer_legends.js"></script>
<script src="data/tt_players.js"></script>
<script src="data/bd_players.js"></script>
<script src="app.js"></script>
</body>
</html>
